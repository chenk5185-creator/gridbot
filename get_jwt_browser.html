<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StandX JWT Token 获取工具</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .step {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
        }
        .step-number {
            width: 32px;
            height: 32px;
            background: #3b82f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .step-content h3 {
            margin-bottom: 8px;
        }
        .step-content p {
            color: #94a3b8;
            font-size: 14px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background: #2563eb; }
        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        .status.success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            display: block;
        }
        .status.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            display: block;
        }
        .status.info {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            display: block;
        }
        .token-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
        }
        .copy-btn {
            background: #10b981;
            margin-top: 10px;
        }
        a { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 StandX JWT Token 获取工具</h1>
        <p class="subtitle">
            根据 <a href="https://docs.standx.com/standx-api/perps-auth" target="_blank">StandX 官方文档</a> 实现
        </p>

        <div class="card">
            <div class="step">
                <div class="step-number">1</div>
                <div class="step-content">
                    <h3>连接 MetaMask</h3>
                    <p>点击下方按钮连接你的 MetaMask 钱包</p>
                </div>
            </div>
            <button id="connectBtn" onclick="connectWallet()">连接 MetaMask</button>
            <div id="walletStatus" class="status"></div>
        </div>

        <div class="card">
            <div class="step">
                <div class="step-number">2</div>
                <div class="step-content">
                    <h3>签名并获取 Token</h3>
                    <p>调用 StandX API 获取待签名消息，然后用 MetaMask 签名</p>
                </div>
            </div>
            <button id="getTokenBtn" onclick="getToken()" disabled>获取 JWT Token</button>
            <div id="tokenStatus" class="status"></div>
        </div>

        <div class="card" id="resultCard" style="display: none;">
            <h3>✅ JWT Token</h3>
            <div id="tokenBox" class="token-box"></div>
            <button class="copy-btn" onclick="copyToken()">📋 复制 Token</button>
            <p style="margin-top: 15px; color: #94a3b8; font-size: 14px;">
                将此 Token 粘贴到网格交易工具的 API 配置中
            </p>
        </div>
    </div>

    <script>
        const API_BASE = "https://api.standx.com/v1/offchain";
        const CHAIN = "bsc";

        let walletAddress = null;
        let jwtToken = null;

        async function connectWallet() {
            const status = document.getElementById('walletStatus');
            const btn = document.getElementById('connectBtn');

            if (typeof window.ethereum === 'undefined') {
                status.className = 'status error';
                status.textContent = '❌ 请先安装 MetaMask';
                status.style.display = 'block';
                return;
            }

            try {
                btn.disabled = true;
                btn.textContent = '连接中...';

                const accounts = await window.ethereum.request({
                    method: 'eth_requestAccounts'
                });

                walletAddress = accounts[0];

                status.className = 'status success';
                status.innerHTML = `✅ 已连接: ${walletAddress.slice(0, 6)}...${walletAddress.slice(-4)}`;
                status.style.display = 'block';

                btn.textContent = '已连接';
                document.getElementById('getTokenBtn').disabled = false;

            } catch (error) {
                status.className = 'status error';
                status.textContent = `❌ 连接失败: ${error.message}`;
                status.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '连接 MetaMask';
            }
        }

        async function getToken() {
            const status = document.getElementById('tokenStatus');
            const btn = document.getElementById('getTokenBtn');

            if (!walletAddress) {
                status.className = 'status error';
                status.textContent = '❌ 请先连接钱包';
                status.style.display = 'block';
                return;
            }

            try {
                btn.disabled = true;
                btn.textContent = '获取中...';

                // Step 1: 调用 prepare-signin
                status.className = 'status info';
                status.textContent = '⏳ 步骤 1/3: 调用 prepare-signin...';
                status.style.display = 'block';

                const prepareResponse = await fetch(`${API_BASE}/prepare-signin?chain=${CHAIN}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        address: walletAddress,
                        requestId: walletAddress.slice(0, 20)
                    })
                });

                if (!prepareResponse.ok) {
                    throw new Error(`prepare-signin 失败: ${await prepareResponse.text()}`);
                }

                const prepareData = await prepareResponse.json();
                console.log('prepare-signin 响应:', prepareData);

                const signedData = prepareData.signedData;
                if (!signedData) {
                    throw new Error('未获取到 signedData');
                }

                // Step 2: 使用 MetaMask 签名
                status.textContent = '⏳ 步骤 2/3: 请在 MetaMask 中签名...';

                const signature = await window.ethereum.request({
                    method: 'personal_sign',
                    params: [signedData, walletAddress]
                });

                console.log('签名:', signature);

                // Step 3: 调用 login
                status.textContent = '⏳ 步骤 3/3: 调用 login 获取 Token...';

                const loginResponse = await fetch(`${API_BASE}/login?chain=${CHAIN}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        signature: signature,
                        signedData: signedData,
                        expiresSeconds: 604800  // 7 天
                    })
                });

                if (!loginResponse.ok) {
                    throw new Error(`login 失败: ${await loginResponse.text()}`);
                }

                const loginData = await loginResponse.json();
                console.log('login 响应:', loginData);

                jwtToken = loginData.token;
                if (!jwtToken) {
                    throw new Error('未获取到 token');
                }

                // 显示结果
                status.className = 'status success';
                status.textContent = '✅ JWT Token 获取成功!';

                document.getElementById('tokenBox').textContent = jwtToken;
                document.getElementById('resultCard').style.display = 'block';

                btn.textContent = '获取成功';

            } catch (error) {
                console.error('错误:', error);
                status.className = 'status error';
                status.textContent = `❌ ${error.message}`;
                status.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '重试';
            }
        }

        function copyToken() {
            if (jwtToken) {
                navigator.clipboard.writeText(jwtToken);
                alert('Token 已复制到剪贴板!');
            }
        }
    </script>
</body>
</html>
